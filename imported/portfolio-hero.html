<script type="module">
// ============================================
// THREE.JS (import map, shared instance with addons)
// ============================================
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const DEBUG = new URLSearchParams(location.search).has('debug');
const debugEl = document.getElementById('debug');
if (DEBUG) debugEl.style.display = 'block';
const log = (msg) => {
  console.log(msg);
  if (DEBUG) debugEl.textContent = (debugEl.textContent + '\n' + msg).split('\n').slice(-14).join('\n');
};

log('Three.js loaded: ' + THREE.REVISION);

try {
// ============================================
// CONFIG & STATE
// ============================================
const CONFIG = {
  flowerCount: 12000,
  dustCount: 3000,
  terrainSize: 400,
  terrainSegments: 200,
  cameraHeight: 8,
  driftSpeed: 0.3,
  touchMultiplier: 20,
  mousePushRadius: 1.2,
  cameraTiltFactor: 0.08,
  bloomStrength: 0.7,
  bloomRadius: 0.6,
  bloomThreshold: 0.1,
  vignetteBase: 0.3,
  vignetteMax: 0.75,
  transitionDuration: 2.5
};

const state = {
  progress: 0,
  targetProgress: 0,
  velocity: 0,
  isHovering: false,
  transitionProgress: 0,
  transitionDirection: 0,
  audioPlaying: false,
  audioInitialized: false,
  introDone: false,
  mouse: { x: 0, y: 0, targetX: 0, targetY: 0 },
  lastProgress: 0,
  touchStartY: 0,
  touchStartProgress: 0
};

// ============================================
// HELPER FUNCTIONS (defined early)
// ============================================
function terrainHeight(x, z) {
  let y = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 8;
  y += Math.sin(x * 0.02 + 10) * Math.cos(z * 0.03) * 15;
  y += Math.sin(x * 0.1) * 3;
  y += Math.sin(z * 0.08) * 2;
  y -= Math.max(0, 15 - Math.hypot(x, z) * 0.3);
  return y;
}

const wrap01 = v => ((v % 1) + 1) % 1;

// ============================================
// SHADERS (defined BEFORE they are used)
// ============================================
const FlowerShader = {
  uniforms: {
    uTime: { value: 0 },
    uProgress: { value: 0 },
    uMouse: { value: new THREE.Vector2() },
    uMousePush: { value: 0 },
    uTransition: { value: 0 },
    uCameraPos: { value: new THREE.Vector3() },
    uResolution: { value: new THREE.Vector2() },
    uColorA: { value: new THREE.Color(0xff6b35) },
    uColorB: { value: new THREE.Color(0xffd4aa) },
    uColorC: { value: new THREE.Color(0x88ff88) }
  },
  vertexShader: `
    attribute float aIndex;
    attribute float aPhase;
    attribute float aScale;
    attribute vec3 aBasePos;
    attribute vec2 aColorMix;
    varying float vPhase;
    varying float vScale;
    varying vec2 vColorMix;
    varying vec3 vWorldPos;
    varying float vDepth;
    uniform float uTime;
    uniform float uProgress;
    uniform vec2 uMouse;
    uniform float uMousePush;
    uniform float uTransition;
    uniform vec3 uCameraPos;
    uniform vec2 uResolution;
    uniform vec3 uColorA;
    uniform vec3 uColorB;
    uniform vec3 uColorC;
    
    float hash(float n) { return fract(sin(n) * 43758.5453); }
    float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float noise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash2(i), hash2(i + vec2(1,0)), f.x), mix(hash2(i + vec2(0,1)), hash2(i + vec2(1,1)), f.x), f.y);
    }
    float fbm(vec2 p) {
      float v = 0.0, a = 0.5;
      for(int i=0;i<5;i++) { v += a * noise(p); p *= 2.0; a *= 0.5; }
      return v;
    }
    
    void main() {
      vPhase = aPhase;
      vScale = aScale;
      vColorMix = aColorMix;
      vWorldPos = aBasePos;
      
      vec3 pos = aBasePos;
      
      // Bloom growth based on camera distance
      float distToCam = length(pos - uCameraPos);
      float bloomFactor = smoothstep(80.0, 15.0, distToCam);
      float scale = aScale * mix(0.15, 1.0, bloomFactor);
      
      // Mouse push in screen space
      vec4 screenPos = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      vec2 ndc = screenPos.xy / screenPos.w;
      vec2 mouseNdc = uMouse * 2.0 - 1.0;
      float mouseDist = length(ndc - mouseNdc);
      float push = smoothstep(0.0, uMousePush, 1.0 - mouseDist) * uMousePush * 0.5;
      vec2 toMouse = ndc - mouseNdc;
      vec2 pushDir = toMouse / max(length(toMouse), 0.0001);
      
      // Transition dispersion
      float disperse = uTransition * (0.5 + 0.5 * hash(aIndex)) * 50.0;
      pos += vec3(pushDir * push * 10.0, 0.0) + normalize(pos - uCameraPos) * disperse;
      
      // Vertical breathing
      pos.y += sin(uTime * 0.8 + aPhase) * 0.15 * scale;
      
      // Wind sway
      float wind = fbm(vec2(pos.x * 0.01, uTime * 0.15)) * 0.3;
      pos.x += wind * scale;
      pos.z += wind * scale * 0.5;
      
      vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
      vDepth = -mvPos.z;
      gl_Position = projectionMatrix * mvPos;
      gl_PointSize = scale * (300.0 / -mvPos.z) * uResolution.y * 0.001;
      gl_PointSize = clamp(gl_PointSize, 0.5, 80.0);
    }
  `,
  fragmentShader: `
    varying float vPhase;
    varying float vScale;
    varying vec2 vColorMix;
    varying vec3 vWorldPos;
    varying float vDepth;
    uniform vec3 uColorA;
    uniform vec3 uColorB;
    uniform vec3 uColorC;
    uniform float uTransition;
    uniform vec2 uMouse;
    
    float hash(float n) { return fract(sin(n) * 43758.5453); }
    
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float r = length(uv) * 2.0;
      
      // Soft particle shape
      float shape = smoothstep(1.0, 0.0, r);
      shape *= smoothstep(0.0, 0.3, 1.0 - r);
      
      // Color mixing
      vec3 color = mix(uColorA, uColorB, vColorMix.x);
      color = mix(color, uColorC, vColorMix.y);
      
      // Glow center
      float glow = 1.0 - smoothstep(0.0, 0.5, r);
      color += vec3(1.0, 0.6, 0.2) * glow * 0.8;
      
      // Transition fade
      float alpha = shape * (1.0 - uTransition * 0.3);
      
      gl_FragColor = vec4(color, alpha);
      if (alpha < 0.01) discard;
    }
  `
};

const DustShader = {
  uniforms: {
    uTime: { value: 0 },
    uCameraPos: { value: new THREE.Vector3() },
    uResolution: { value: new THREE.Vector2() },
    uTransition: { value: 0 }
  },
  vertexShader: `
    attribute float aIndex;
    attribute vec3 aBasePos;
    attribute float aSpeed;
    varying float vSpeed;
    varying vec3 vWorldPos;
    uniform float uTime;
    uniform vec3 uCameraPos;
    uniform vec2 uResolution;
    uniform float uTransition;
    
    float hash(float n) { return fract(sin(n) * 43758.5453); }
    
    void main() {
      vSpeed = aSpeed;
      vec3 pos = aBasePos;
      pos.y += sin(uTime * aSpeed + aIndex) * 2.0;
      pos.x += sin(uTime * 0.05 + aIndex) * 5.0;
      pos.z += cos(uTime * 0.05 + aIndex) * 5.0;
      
      float disperse = uTransition * hash(aIndex) * 100.0;
      pos += normalize(pos - uCameraPos) * disperse;
      
      vWorldPos = pos;
      vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPos;
      gl_PointSize = (1.0 + hash(aIndex) * 2.0) * (200.0 / -mvPos.z) * uResolution.y * 0.001;
      gl_PointSize = clamp(gl_PointSize, 0.5, 4.0);
    }
  `,
  fragmentShader: `
    varying float vSpeed;
    varying vec3 vWorldPos;
    uniform float uTransition;
    
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float r = length(uv) * 2.0;
      float shape = smoothstep(1.0, 0.0, r);
      float alpha = shape * (0.3 + 0.3 * sin(vSpeed * 100.0)) * (1.0 - uTransition * 0.5);
      gl_FragColor = vec4(0.96, 0.92, 0.82, alpha);
      if (alpha < 0.005) discard;
    }
  `
};

const NoiseShader = {
  uniforms: {
    uTime: { value: 0 },
    uIntensity: { value: 0.08 },
    tDiffuse: { value: null }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime; uniform float uIntensity; uniform sampler2D tDiffuse;
    varying vec2 vUv;
    float rand(vec2 co) { return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec2 noiseUv = vUv * 1.0 + uTime * 0.02;
      float n = rand(noiseUv + floor(vUv * 200.0)) * 2.0 - 1.0;
      vec4 color = texture2D(tDiffuse, vUv);
      vec2 offset = vec2(n, 0.0) * uIntensity * 0.005;
      color.r = texture2D(tDiffuse, vUv + offset).r;
      color.b = texture2D(tDiffuse, vUv - offset).b;
      color.rgb *= 1.0 - 0.03 * sin(vUv.y * 800.0 + uTime * 5.0);
      gl_FragColor = color;
    }
  `
};

const VignetteShader = {
  uniforms: {
    uIntensity: { value: 0.3 },
    tDiffuse: { value: null }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uIntensity; uniform sampler2D tDiffuse; varying vec2 vUv;
    void main() {
      vec4 color = texture2D(tDiffuse, vUv);
      float dist = length(vUv - 0.5) * 1.4;
      float vig = smoothstep(0.4, 1.0, dist) * uIntensity;
      color.rgb *= 1.0 - vig;
      gl_FragColor = color;
    }
  `
};

const RGBShiftShader = {
  uniforms: {
    uAmount: { value: 0.0015 },
    tDiffuse: { value: null }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uAmount; uniform sampler2D tDiffuse; varying vec2 vUv;
    void main() {
      vec2 offset = vec2(uAmount, 0.0);
      float r = texture2D(tDiffuse, vUv + offset).r;
      float g = texture2D(tDiffuse, vUv).g;
      float b = texture2D(tDiffuse, vUv - offset).b;
      gl_FragColor = vec4(r, g, b, 1.0);
    }
  `
};

const LightRayShader = {
  uniforms: {
    uTime: { value: 0 },
    uCameraPos: { value: new THREE.Vector3() },
    uResolution: { value: new THREE.Vector2() }
  },
  vertexShader: `
    attribute float aIndex;
    attribute float aAngle;
    attribute float aDistance;
    attribute float aHeight;
    attribute float aScale;
    varying float vAngle;
    varying float vScale;
    uniform float uTime;
    uniform vec3 uCameraPos;
    uniform vec2 uResolution;
    
    void main() {
      vAngle = aAngle;
      vScale = aScale;
      float angle = aAngle + uTime * 0.02;
      vec3 pos = vec3(
        cos(angle) * aDistance,
        aHeight,
        sin(angle) * aDistance
      );
      vec4 mvPos = modelViewMatrix * vec4(pos, 1.0);
      gl_Position = projectionMatrix * mvPos;
      gl_PointSize = aScale * (400.0 / -mvPos.z) * uResolution.y * 0.001;
    }
  `,
  fragmentShader: `
    varying float vAngle;
    varying float vScale;
    uniform float uTime;
    void main() {
      vec2 uv = gl_PointCoord - 0.5;
      float r = length(uv) * 2.0;
      float shape = smoothstep(1.0, 0.0, r) * smoothstep(0.0, 0.8, 1.0 - r);
      float ray = smoothstep(0.5, 0.0, abs(uv.x) * 8.0) * smoothstep(1.0, 0.0, uv.y + 0.5);
      float alpha = (shape * 0.3 + ray * 0.7) * vScale * 0.15;
      gl_FragColor = vec4(1.0, 0.7, 0.3, alpha);
      if (alpha < 0.005) discard;
    }
  `
};

// ============================================
// CAMERA PATH GENERATION
// ============================================
function generateCameraPath() {
  const points = [];
  const segments = 200;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const angle = t * Math.PI * 2.5;
    const radius = 60 + Math.sin(t * Math.PI * 4) * 25;
    const x = Math.cos(angle) * radius;
    const z = Math.sin(angle) * radius;
    const baseY = CONFIG.cameraHeight + Math.sin(t * Math.PI * 6) * 3 + Math.sin(t * Math.PI * 1.5) * 1.5;
    const y = Math.max(baseY, terrainHeight(x, z) + 4);
    points.push(new THREE.Vector3(x, y, z));
  }
  const curve = new THREE.CatmullRomCurve3(points);
  curve.closed = true;
  return curve;
}

const cameraPath = generateCameraPath();

// ============================================
// TERRAIN
// ============================================
function createTerrain() {
  const geometry = new THREE.PlaneGeometry(CONFIG.terrainSize, CONFIG.terrainSize, CONFIG.terrainSegments, CONFIG.terrainSegments);
  geometry.rotateX(-Math.PI / 2);
  
  const position = geometry.attributes.position;
  for (let i = 0; i < position.count; i++) {
    position.setY(i, terrainHeight(position.getX(i), position.getZ(i)));
  }
  geometry.computeVertexNormals();
  
  const material = new THREE.MeshBasicMaterial({ 
    color: 0x050505, 
    side: THREE.DoubleSide,
    transparent: true,
    opacity: 0.6
  });
  
  return new THREE.Mesh(geometry, material);
}

// ============================================
// FLOWER FIELD
// ============================================
function createFlowerField() {
  const count = CONFIG.flowerCount;
  const geometry = new THREE.BufferGeometry();
  
  const positions = new Float32Array(count * 3);
  const indices = new Float32Array(count);
  const phases = new Float32Array(count);
  const scales = new Float32Array(count);
  const colorMixes = new Float32Array(count * 2);
  
  for (let i = 0; i < count; i++) {
    let x, z, y;
    let attempts = 0;
    do {
      const angle = Math.random() * Math.PI * 2;
      const radius = Math.pow(Math.random(), 0.7) * (CONFIG.terrainSize * 0.45);
      x = Math.cos(angle) * radius;
      z = Math.sin(angle) * radius;
      y = terrainHeight(x, z);
      attempts++;
    } while (y > 5 && attempts < 10);
    
    positions[i * 3] = x;
    positions[i * 3 + 1] = y + 0.1;
    positions[i * 3 + 2] = z;
    indices[i] = i;
    phases[i] = Math.random() * Math.PI * 2;
    scales[i] = 0.5 + Math.random() * 1.2;
    const isLeaf = Math.random() < 0.3;
    colorMixes[i * 2] = isLeaf ? 0 : 0.3 + Math.random() * 0.7;
    colorMixes[i * 2 + 1] = isLeaf ? 1 : 0;
  }
  
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aIndex', new THREE.BufferAttribute(indices, 1));
  geometry.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
  geometry.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
  geometry.setAttribute('aColorMix', new THREE.BufferAttribute(colorMixes, 2));
  geometry.setAttribute('aBasePos', new THREE.BufferAttribute(positions.slice(), 3));
  
  const material = new THREE.ShaderMaterial({
    ...FlowerShader,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  
  return new THREE.Points(geometry, material);
}

// ============================================
// DUST PARTICLES
// ============================================
function createDust() {
  const count = CONFIG.dustCount;
  const geometry = new THREE.BufferGeometry();
  
  const positions = new Float32Array(count * 3);
  const indices = new Float32Array(count);
  const speeds = new Float32Array(count);
  
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * CONFIG.terrainSize * 0.5;
    positions[i * 3] = Math.cos(angle) * radius;
    positions[i * 3 + 1] = Math.random() * 30 + 2;
    positions[i * 3 + 2] = Math.sin(angle) * radius;
    indices[i] = i;
    speeds[i] = 0.3 + Math.random() * 0.7;
  }
  
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aIndex', new THREE.BufferAttribute(indices, 1));
  geometry.setAttribute('aSpeed', new THREE.BufferAttribute(speeds, 1));
  geometry.setAttribute('aBasePos', new THREE.BufferAttribute(positions.slice(), 3));
  
  const material = new THREE.ShaderMaterial({
    ...DustShader,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  
  return new THREE.Points(geometry, material);
}

// ============================================
// LIGHT RAYS
// ============================================
function createLightRays() {
  const count = 60;
  const geometry = new THREE.BufferGeometry();
  
  const indices = new Float32Array(count);
  const angles = new Float32Array(count);
  const distances = new Float32Array(count);
  const heights = new Float32Array(count);
  const scales = new Float32Array(count);
  
  for (let i = 0; i < count; i++) {
    indices[i] = i;
    angles[i] = Math.random() * Math.PI * 2;
    distances[i] = 40 + Math.random() * 80;
    heights[i] = -5 + Math.random() * 25;
    scales[i] = 0.5 + Math.random() * 1.5;
  }
  
  geometry.setAttribute('aIndex', new THREE.BufferAttribute(indices, 1));
  geometry.setAttribute('aAngle', new THREE.BufferAttribute(angles, 1));
  geometry.setAttribute('aDistance', new THREE.BufferAttribute(distances, 1));
  geometry.setAttribute('aHeight', new THREE.BufferAttribute(heights, 1));
  geometry.setAttribute('aScale', new THREE.BufferAttribute(scales, 1));
  
  const material = new THREE.ShaderMaterial({
    ...LightRayShader,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  
  return new THREE.Points(geometry, material);
}

// ============================================
// AUDIO
// ============================================
class AudioManager {
  constructor() {
    this.context = null;
    this.gainNode = null;
    this.lowpassFilter = null;
    this.source = null;
    this.buffer = null;
    this.isPlaying = false;
    this.isMuted = true;
    this.isInitialized = false;
    this.muffled = false;
  }
  
  async init() {
    if (this.isInitialized) return;
    
    this.context = new (window.AudioContext || window.webkitAudioContext)();
    this.gainNode = this.context.createGain();
    this.gainNode.gain.value = 0;
    
    this.lowpassFilter = this.context.createBiquadFilter();
    this.lowpassFilter.type = 'lowpass';
    this.lowpassFilter.frequency.value = 22000;
    this.lowpassFilter.Q.value = 1;
    
    this.gainNode.connect(this.lowpassFilter);
    this.lowpassFilter.connect(this.context.destination);
    
    this.buffer = this.generateAmbientBuffer();
    this.isInitialized = true;
    log('Audio initialized');
  }
  
  generateAmbientBuffer() {
    const sampleRate = this.context.sampleRate;
    const duration = 30;
    const length = sampleRate * duration;
    const buffer = this.context.createBuffer(2, length, sampleRate);
    
    for (let channel = 0; channel < 2; channel++) {
      const data = buffer.getChannelData(channel);
      for (let i = 0; i < length; i++) {
        const t = i / sampleRate;
        let sample = 0;
        sample += (Math.random() * 2 - 1) * 0.02;
        sample += (Math.random() * 2 - 1) * 0.01 * Math.sin(t * 0.5);
        sample += Math.sin(t * 55 * 2 * Math.PI) * 0.003;
        sample += Math.sin(t * 82.5 * 2 * Math.PI) * 0.002;
        sample += Math.sin(t * 110 * 2 * Math.PI) * 0.0015;
        sample *= 0.5 + 0.5 * Math.sin(t * 0.05);
        data[i] = sample;
      }
    }
    return buffer;
  }
  
  play() {
    if (!this.isInitialized) return;
    if (this.isPlaying) return;
    
    if (this.context.state === 'suspended') {
      this.context.resume();
    }
    
    this.source = this.context.createBufferSource();
    this.source.buffer = this.buffer;
    this.source.loop = true;
    this.source.connect(this.gainNode);
    this.source.start(0);
    this.isPlaying = true;
    
    this.gainNode.gain.setValueAtTime(0, this.context.currentTime);
    this.gainNode.gain.linearRampToValueAtTime(0.15, this.context.currentTime + 3);
  }
  
  stop() {
    if (this.source) {
      this.gainNode.gain.linearRampToValueAtTime(0, this.context.currentTime + 1);
      setTimeout(() => {
        this.source.stop();
        this.source.disconnect();
        this.isPlaying = false;
      }, 1500);
    }
  }
  
  toggleMute() {
    if (!this.isInitialized) return true;
    this.isMuted = !this.isMuted;
    if (this.isMuted) {
      this.gainNode.gain.linearRampToValueAtTime(0, this.context.currentTime + 1);
    } else {
      this.play();
      this.gainNode.gain.linearRampToValueAtTime(0.15, this.context.currentTime + 2);
    }
    return this.isMuted;
  }
  
  setMuffle(muffled) {
    if (!this.isInitialized || this.muffled === muffled) return;
    this.muffled = muffled;
    const targetFreq = muffled ? 400 : 22000;
    this.lowpassFilter.frequency.linearRampToValueAtTime(targetFreq, this.context.currentTime + CONFIG.transitionDuration * 0.5);
  }
  
  updateTransition(progress) {
    this.setMuffle(progress > 0.1);
  }
}

const audioManager = new AudioManager();

// ============================================
// THREE SETUP
// ============================================
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
camera.position.set(0, CONFIG.cameraHeight, 0);

log('Renderer + Scene + Camera ready');

// Post-processing
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloomPass = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  CONFIG.bloomStrength, CONFIG.bloomRadius, CONFIG.bloomThreshold
);
composer.addPass(bloomPass);

// Custom passes (shaders already defined above — no TDZ)
const noisePass = new ShaderPass(NoiseShader);
composer.addPass(noisePass);

const vignettePass = new ShaderPass(VignetteShader);
composer.addPass(vignettePass);

const rgbShiftPass = new ShaderPass(RGBShiftShader);
composer.addPass(rgbShiftPass);

log('Post-processing ready');

// ============================================
// INIT SCENE OBJECTS
// ============================================
const terrain = createTerrain();
scene.add(terrain);
log('Terrain added');

const flowers = createFlowerField();
scene.add(flowers);
log('Flowers added: ' + CONFIG.flowerCount);

const dust = createDust();
scene.add(dust);
log('Dust added');

const lightRays = createLightRays();
scene.add(lightRays);
log('Light rays added');

// Fog
scene.fog = new THREE.FogExp2(0x000000, 0.0035);

// ============================================
// CAMERA CONTROL
// ============================================
function updateCamera(delta) {
  if (!state.isHovering && state.transitionProgress === 0) {
    state.targetProgress += CONFIG.driftSpeed * delta * 0.001;
  }
  
  state.targetProgress = wrap01(state.targetProgress);
  let dp = state.targetProgress - state.progress;
  dp -= Math.round(dp); // shortest path on circle
  state.progress = wrap01(state.progress + dp * 0.02);
  
  const pos = cameraPath.getPointAt(state.progress);
  const lookAhead = cameraPath.getPointAt((state.progress + 0.02) % 1);
  
  const tiltX = state.mouse.targetY * CONFIG.cameraTiltFactor;
  
  if (state.transitionProgress > 0) {
    const eased = 1 - Math.pow(1 - state.transitionProgress, 3);
    camera.position.lerp(new THREE.Vector3(pos.x, pos.y + eased * 20, pos.z + eased * 30), eased * 0.1);
    camera.lookAt(new THREE.Vector3(lookAhead.x, lookAhead.y - eased * 10, lookAhead.z));
    camera.rotation.z = THREE.MathUtils.lerp(camera.rotation.z, tiltX * (1 - eased), 0.05);
  } else {
    camera.position.lerp(pos, 0.08);
    camera.lookAt(lookAhead);
    camera.rotation.z = THREE.MathUtils.lerp(camera.rotation.z, tiltX, 0.05);
  }
  
  let dv = state.progress - state.lastProgress;
  dv -= Math.round(dv);
  state.velocity = Math.abs(dv) * 1000;
  state.lastProgress = state.progress;
  const vigTarget = CONFIG.vignetteBase + Math.min(state.velocity * 50, CONFIG.vignetteMax - CONFIG.vignetteBase);
  vignettePass.uniforms.uIntensity.value = THREE.MathUtils.lerp(
    vignettePass.uniforms.uIntensity.value, vigTarget, 0.05
  );
  
  rgbShiftPass.uniforms.uAmount.value = THREE.MathUtils.lerp(
    rgbShiftPass.uniforms.uAmount.value, 
    0.0015 + Math.min(state.velocity * 20, 0.008), 0.05
  );
}

// ============================================
// MOUSE HANDLING
// ============================================
function onMouseMove(e) {
  state.mouse.targetX = (e.clientX / window.innerWidth) - 0.5;
  state.mouse.targetY = (e.clientY / window.innerHeight) - 0.5;
}

function onTouchMove(e) {
  if (e.touches[0]) {
    state.mouse.targetX = (e.touches[0].clientX / window.innerWidth) - 0.5;
    state.mouse.targetY = (e.touches[0].clientY / window.innerHeight) - 0.5;
  }
}

function onWheel(e) {
  e.preventDefault();
  state.targetProgress -= e.deltaY * 0.000015 * CONFIG.touchMultiplier;
  state.targetProgress = wrap01(state.targetProgress);
}

function onTouchStart(e) {
  if (e.touches[0]) {
    state.touchStartY = e.touches[0].clientY;
    state.touchStartProgress = state.targetProgress;
  }
}

function onTouchMoveScroll(e) {
  if (e.touches[0] && state.touchStartY !== undefined) {
    const deltaY = state.touchStartY - e.touches[0].clientY;
    state.targetProgress = state.touchStartProgress + deltaY * 0.00008 * CONFIG.touchMultiplier;
    state.targetProgress = wrap01(state.targetProgress);
  }
}

window.addEventListener('mousemove', onMouseMove, { passive: true });
window.addEventListener('touchmove', onTouchMove, { passive: true });
window.addEventListener('wheel', onWheel, { passive: false });
window.addEventListener('touchstart', onTouchStart, { passive: true });
window.addEventListener('touchmove', onTouchMoveScroll, { passive: false });

function updateMouse(delta) {
  state.mouse.x += (state.mouse.targetX - state.mouse.x) * 0.1;
  state.mouse.y += (state.mouse.targetY - state.mouse.y) * 0.1;
}

// ============================================
// HOVER TRANSITION
// ============================================
function startHoverTransition() {
  if (state.transitionDirection === 1) return;
  state.transitionDirection = 1;
  state.isHovering = true;
  audioManager.updateTransition(0);
  log('Hover transition START');
}

function stopHoverTransition() {
  if (state.transitionDirection === -1) return;
  state.transitionDirection = -1;
  state.isHovering = false;
  audioManager.updateTransition(0);
  log('Hover transition STOP');
}

function updateTransition(delta) {
  if (state.transitionDirection === 1) {
    state.transitionProgress = Math.min(1, state.transitionProgress + delta / (CONFIG.transitionDuration * 1000));
    if (state.transitionProgress >= 1) state.transitionDirection = 0;
  } else if (state.transitionDirection === -1) {
    state.transitionProgress = Math.max(0, state.transitionProgress - delta / (CONFIG.transitionDuration * 1000));
    if (state.transitionProgress <= 0) {
      state.transitionDirection = 0;
      state.transitionProgress = 0;
    }
  }
  audioManager.updateTransition(state.transitionProgress);
}

// ============================================
// ANIMATION LOOP
// ============================================
let lastTime = 0;
let introReported = false;

function animate(time) {
  const delta = Math.min(time - lastTime, 100);
  lastTime = time;
  
  updateMouse(delta);
  updateTransition(delta);
  updateCamera(delta);
  
  const uTime = time * 0.001;
  flowers.material.uniforms.uTime.value = uTime;
  flowers.material.uniforms.uProgress.value = state.progress;
  flowers.material.uniforms.uMouse.value.set(state.mouse.x + 0.5, 0.5 - state.mouse.y);
  flowers.material.uniforms.uMousePush.value = CONFIG.mousePushRadius;
  flowers.material.uniforms.uTransition.value = state.transitionProgress;
  flowers.material.uniforms.uCameraPos.value.copy(camera.position);
  flowers.material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
  
  dust.material.uniforms.uTime.value = uTime;
  dust.material.uniforms.uCameraPos.value.copy(camera.position);
  dust.material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
  dust.material.uniforms.uTransition.value = state.transitionProgress;
  
  lightRays.material.uniforms.uTime.value = uTime;
  lightRays.material.uniforms.uCameraPos.value.copy(camera.position);
  lightRays.material.uniforms.uResolution.value.set(window.innerWidth, window.innerHeight);
  
  noisePass.uniforms.uTime.value = uTime;
  
  if (!introReported && time > 3000) {
    introReported = true;
    document.getElementById('ui').classList.add('on');
    log('Intro done - UI revealed');
  }
  
  composer.render(delta * 0.001);
  requestAnimationFrame(animate);
}

// ============================================
// RESIZE
// ============================================
function onResize() {
  const width = window.innerWidth;
  const height = window.innerHeight;
  
  renderer.setSize(width, height);
  composer.setSize(width, height);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  
  bloomPass.resolution.set(width, height);
  
  flowers.material.uniforms.uResolution.value.set(width, height);
  dust.material.uniforms.uResolution.value.set(width, height);
  lightRays.material.uniforms.uResolution.value.set(width, height);
}

window.addEventListener('resize', onResize);

// ============================================
// UI INTERACTIONS
// ============================================
const soundBtn = document.getElementById('sound');
const goBtn = document.getElementById('go');
const loader = document.getElementById('loader');

goBtn.addEventListener('pointerenter', startHoverTransition);
goBtn.addEventListener('pointerleave', stopHoverTransition);

soundBtn.addEventListener('click', async () => {
  if (!audioManager.isInitialized) {
    await audioManager.init();
  }
  const muted = audioManager.toggleMute();
  soundBtn.setAttribute('aria-pressed', String(!muted));
  log('Sound toggled: ' + (!muted ? 'ON' : 'OFF'));
});

// Hide loader after "load"
setTimeout(() => {
  loader.classList.add('gone');
  setTimeout(() => loader.style.display = 'none', 1000);
  log('Loader hidden');
}, 1500);

// ============================================
// START
// ============================================
requestAnimationFrame(animate);
log('Animation loop started');

console.log('%c🌿 Portfolio Hero — Vallée 3D interactive', 'font-size: 16px; color: #f5efe2; font-weight: bold');
console.log('%cBasé sur l\'original Fernhollow (Gladeye) — Réinterprétation standalone', 'color: #888');

} catch (err) {
  console.error(err);
  debugEl.style.display = 'block';
  debugEl.textContent = 'ERROR: ' + err.message;
}
